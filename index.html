<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aub Car Maintenance Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Aub Car Maintenance Log</h1>

        <div class="panel">
            <input type="text" id="service" placeholder="Service (Ex. Oil Change)">
            <input type="date" id="date">
            <input type="number" id="mileage" placeholder="Mileage">
            <input type="text" id="notes" placeholder="Notes">
            <button id="add">Add Entry</button>
            <button id="clear">Clear Entries</button>
        </div>

        <div id="list"></div>
    </div>

    <script src="index.js"></script>
</html>
